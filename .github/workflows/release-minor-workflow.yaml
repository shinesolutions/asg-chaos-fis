---
name: Release Minor
on: [workflow_dispatch]
# The release action pushes with the organisation token, not GITHUB_TOKEN.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: cliffano/release-action@v2.2.0
        with:
          release_type: minor
          github_token: ${{ secrets.SHINEOPENSOURCE_GITHUB_TOKEN }}
          git_user_email: opensource@shinesolutions.com
          git_user_name: Shine Solutions
