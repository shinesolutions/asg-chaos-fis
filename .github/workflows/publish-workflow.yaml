---
# Attaches stage/asg-chaos-fis-<version>.zip and its .sha256 checksum file to
# the GitHub release for each version tag, where deployments such as
# aem-aws-stack-builder's fetch-library playbook download them.
name: Publish
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - run: make ci version="${GITHUB_REF_NAME}"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md"
          gh release upload "${GITHUB_REF_NAME}" \
            "stage/asg-chaos-fis-${GITHUB_REF_NAME}.zip" \
            "stage/asg-chaos-fis-${GITHUB_REF_NAME}.zip.sha256" \
            --clobber
