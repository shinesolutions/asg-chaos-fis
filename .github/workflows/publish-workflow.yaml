---
# Attaches stage/asg-chaos-fis-<version>.zip and its .sha256 checksum file to
# the GitHub release for each version tag, where deployments such as
# aem-aws-stack-builder's fetch-library playbook download them.
name: Publish
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: make ci version="${GITHUB_REF_NAME}"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md"
          gh release upload "${GITHUB_REF_NAME}" \
            "stage/asg-chaos-fis-${GITHUB_REF_NAME}.zip" \
            "stage/asg-chaos-fis-${GITHUB_REF_NAME}.zip.sha256" \
            --clobber
