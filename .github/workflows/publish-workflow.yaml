---
name: Publish
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: make ci
          image: shinesolutions/aem-platform-buildenv:6.3.0
          shell: bash
      - run: make publish
        env:
          GITHUB_TOKEN: ${{ secrets.SHINEOPENSOURCE_GITHUB_TOKEN }}
